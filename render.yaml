services:
  - type: web
    name: stockpulse-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TZ
        value: Asia/Jakarta
    dockerfilePath: ./backend/Dockerfile
  
  - type: cron
    name: stockpulse-refresh
    runtime: docker
    plan: free
    schedule: "0 10 * * 1-5"
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: JOB_REFRESH
        value: "1"